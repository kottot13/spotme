name: Package and release

# Runs when a tag is pushed (e.g. v0.11.0). The tag is the version number.
on:
  push:
    tags:
      - '**'

# Required so the packager can create a GitHub Release
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}         # CurseForge
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }} # Wago Addons
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }} # WoWInterface (optional)
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}     # GitHub Releases (built-in)
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — for the auto-generated changelog

      # Lint the Lua before building — if luacheck fails, the release stops here.
      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v4
      - name: Lint (luacheck)
        run: |
          luarocks install luacheck
          luacheck Core.lua Locale.lua

      - name: Package and release
        uses: BigWigsMods/packager@v2
